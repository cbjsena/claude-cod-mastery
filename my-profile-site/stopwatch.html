<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스톱워치</title>

  <!-- Tailwind CSS를 CDN으로 불러옵니다. 설치 없이 바로 스타일 클래스를 쓸 수 있어요. -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <!-- 스톱워치 전체를 감싸는 하얀 카드 -->
  <div class="bg-white rounded-2xl shadow-lg p-8 w-80 text-center">

    <h1 class="text-2xl font-bold text-slate-800 mb-6">스톱워치</h1>

    <!--
      시간을 보여주는 부분입니다.
      id="time"이라는 이름표를 붙여서 JavaScript가 이 자리를 찾아 글자를 바꿀 수 있게 했어요.
      font-mono를 쓰면 숫자 폭이 일정해서 시간이 바뀌어도 화면이 덜덜 떨리지 않아요.
    -->
    <p id="time" class="text-5xl font-mono font-extrabold text-blue-600 mb-8">
      00:00:00
    </p>

    <!-- 버튼 2개를 가로로 나란히 배치 -->
    <div class="flex justify-center gap-3">

      <!--
        시작/일시정지 버튼입니다.
        id="toggleBtn"으로 이름표를 붙여서, JavaScript가 버튼 글자(시작 ↔ 일시정지)를
        상황에 맞게 바꿔줄 수 있게 했어요.
      -->
      <button
        id="toggleBtn"
        onclick="toggleTimer()"
        class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold px-6 h-12 rounded-full transition-colors w-28"
      >
        시작
      </button>

      <!-- 리셋 버튼: 시간을 0으로 되돌리고 정지 상태로 만듭니다. -->
      <button
        onclick="resetTimer()"
        class="bg-slate-400 hover:bg-slate-500 active:bg-slate-600 text-white font-semibold px-6 h-12 rounded-full transition-colors w-28"
      >
        리셋
      </button>

    </div>
  </div>

  <script>
    // ── 상태를 저장하는 변수들 ──────────────────────────────
    // elapsedMs: 지금까지 흘러간 시간을 "밀리초(1000분의 1초)" 단위로 저장해요.
    let elapsedMs = 0;

    // intervalId: setInterval(반복 타이머)을 나중에 멈출 때 필요한 "꼬리표 번호"예요.
    // 타이머가 꺼져 있을 땐 null(아무것도 없음)로 둡니다.
    let intervalId = null;

    // startTimestamp: "시작(재생)" 버튼을 누른 순간의 실제 시각을 저장해요.
    // 이걸 기준으로 "지금이 몇 시니까 몇 초가 지났구나"를 계산합니다.
    let startTimestamp = 0;

    // 화면 요소들을 미리 찾아서 변수에 담아둡니다.
    const timeDisplay = document.getElementById("time");
    const toggleBtn = document.getElementById("toggleBtn");

    // ── 시간을 "00:00:00" 형태의 글자로 바꿔주는 함수 ──────────
    function formatTime(ms) {
      // 총 밀리초를 "초" 단위로 바꾼 뒤, 시/분/초로 각각 쪼갭니다.
      const totalSeconds = Math.floor(ms / 1000);

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      // padStart(2, "0")는 "한 자리 숫자면 앞에 0을 채워서 두 자리로 만들어라"는 뜻이에요.
      // 예: 5 → "05"
      const pad = (num) => String(num).padStart(2, "0");

      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    // ── 화면에 현재 시간을 표시하는 함수 ──────────────────────
    function updateDisplay() {
      timeDisplay.textContent = formatTime(elapsedMs);
    }

    // ── 시작 / 일시정지 버튼을 누르면 실행되는 함수 ────────────
    function toggleTimer() {
      if (intervalId === null) {
        // 현재 멈춰 있는 상태 → 시작시키기

        // "지금 시각"에서 "이미 흘러간 시간"을 뺀 값을 시작 기준점으로 잡아요.
        // 이렇게 해야 일시정지 후 다시 시작해도 시간이 이어서 흘러가요.
        startTimestamp = Date.now() - elapsedMs;

        // setInterval은 "괄호 안의 코드를 몇 밀리초마다 반복 실행해라"는 명령이에요.
        // 여기서는 10밀리초(0.01초)마다 시간을 다시 계산해서 화면에 표시합니다.
        intervalId = setInterval(() => {
          elapsedMs = Date.now() - startTimestamp;
          updateDisplay();
        }, 10);

        toggleBtn.textContent = "일시정지";
      } else {
        // 현재 실행 중인 상태 → 멈추기

        // clearInterval은 setInterval을 멈추는 명령이에요. 꼬리표 번호(intervalId)로 멈출 반복을 지정해요.
        clearInterval(intervalId);
        intervalId = null;

        toggleBtn.textContent = "시작";
      }
    }

    // ── 리셋 버튼을 누르면 실행되는 함수 ───────────────────────
    function resetTimer() {
      // 실행 중이었다면 먼저 멈추고
      clearInterval(intervalId);
      intervalId = null;

      // 시간을 0으로 되돌리고 화면도 갱신
      elapsedMs = 0;
      updateDisplay();

      toggleBtn.textContent = "시작";
    }
  </script>

</body>
</html>
