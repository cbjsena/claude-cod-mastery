<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 웹사이트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .title {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f5f5f5;
            color: #333;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .social-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .bio {
                font-size: 14px;
            }

            .social-link {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-image">👤</div>

        <h1>김민준</h1>
        <p class="title">웹 개발자 & 디자이너</p>

        <p class="bio">
            안녕하세요! 저는 사용자 경험을 중시하는 웹 개발자입니다.
            아름답고 기능적인 웹사이트를 만드는 것을 좋아합니다.
        </p>

        <div class="social-links">
            <a href="https://github.com" class="social-link" title="GitHub">G</a>
            <a href="https://twitter.com" class="social-link" title="Twitter">𝕏</a>
            <a href="https://linkedin.com" class="social-link" title="LinkedIn">in</a>
            <a href="mailto:contact@example.com" class="social-link" title="Email">✉</a>
        </div>
    </div>
</body>
</html>
